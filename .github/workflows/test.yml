name: Tests

on:
  push:
    branches: [ dev2026, main, master ]
  pull_request:
    branches: [ dev2026, main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('tpmontrouge/setup.py') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libxkbcommon-x11-0 libdbus-1-3 \
                                 libegl1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
                                 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
                                 libxcb-xfixes0 x11-utils libxcb-cursor0
        python -m pip install --upgrade pip
        pip install numpy scipy matplotlib PyQt5 pyqtgraph
    
    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy matplotlib PyQt5 pyqtgraph
    
    - name: Install package
      run: |
        cd tpmontrouge
        pip install -e .
    
    - name: Run tests (Linux)
      if: runner.os == 'Linux'
      env:
        QT_QPA_PLATFORM: offscreen
        PYTHONWARNINGS: "ignore::DeprecationWarning,ignore::UserWarning"
      run: |
        cd tpmontrouge
        chmod +x run_tests.sh
        ./run_tests.sh
    
    - name: Run tests (Windows)
      if: runner.os == 'Windows'
      env:
        PYTHONWARNINGS: "ignore::DeprecationWarning,ignore::UserWarning"
      run: |
        cd tpmontrouge
        python -m unittest discover
    
    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
        path: |
          **/*.log
          **/test-results/
