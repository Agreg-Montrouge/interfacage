name: Build Windows Executables

on:
  push:
    tags:
      - 'v*'  # Trigger sur les tags version (ex: v2025.02.0)
  workflow_dispatch:  # Permet déclenchement manuel depuis GitHub UI

jobs:
  build-windows:
    name: Build Windows .exe with PyInstaller
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\pip\Cache
        key: windows-pip-${{ hashFiles('setup.py') }}
        restore-keys: |
          windows-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy matplotlib PyQt5 pyqtgraph
        pip install pyinstaller
    
    - name: Install package
      run: |
        cd tpmontrouge
        pip install -e .
    
    - name: Build empty_bode.exe
      run: |
        cd tpmontrouge/scripts
        pyinstaller -y empty_bode.spec
        cd ../..
    
    - name: Test empty_bode.exe
      run: |
        .\tpmontrouge\scripts\dist\empty_bode.exe
    
    - name: Build interface.exe
      run: |
        cd tpmontrouge/scripts
        pyinstaller -y interface.spec
        cd ../..
    
    - name: Install Inno Setup
      run: |
        choco install innosetup -y
    
    - name: Generate Inno Setup script with version
      shell: pwsh
      run: |
        $version = python -c "import tpmontrouge; print(tpmontrouge.__version__)"
        $template = Get-Content tpmontrouge/scripts/interface_gui.iss.tpl -Raw
        $output = $template -replace '\$version', $version
        $output | Set-Content tpmontrouge/scripts/interface_gui.iss -Encoding UTF8
        Write-Host "Generated interface_gui.iss with version: $version"
    
    - name: Build interface_folder (needed for installer)
      run: |
        cd tpmontrouge/scripts
        pyinstaller -y interface_folder.spec
        cd ../..
    
    - name: Build installer with Inno Setup
      shell: cmd
      run: |
        "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" tpmontrouge\scripts\interface_gui.iss
    
    - name: Get version for artifact naming
      id: version
      shell: pwsh
      run: |
        $version = python -c "import tpmontrouge; print(tpmontrouge.__version__)"
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "Version: $version"
    
    - name: Rename artifacts with version
      shell: pwsh
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        
        # Créer le dossier dist s'il n'existe pas
        if (-not (Test-Path dist)) {
          New-Item -ItemType Directory -Path dist
        }
        
        # Copier et renommer les executables
        Copy-Item tpmontrouge\scripts\dist\interface.exe dist\interface-$version-win64.exe
        Copy-Item tpmontrouge\scripts\dist\empty_bode.exe dist\empty_bode-$version-win64.exe
        
        # Copier l'installateur s'il existe
        if (Test-Path tpmontrouge\scripts\dist\interface_agreg_setup.exe) {
          Copy-Item tpmontrouge\scripts\dist\interface_agreg_setup.exe dist\interface_agreg_setup-$version.exe
        }
        
        Write-Host "Artifacts renamed with version $version"
    
    - name: Upload interface.exe
      uses: actions/upload-artifact@v4
      with:
        name: interface-exe
        path: dist/interface-*.exe
        retention-days: 90
    
    - name: Upload empty_bode.exe
      uses: actions/upload-artifact@v4
      with:
        name: empty-bode-exe
        path: dist/empty_bode-*.exe
        retention-days: 90
    
    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: installer
        path: dist/interface_agreg_setup-*.exe
        retention-days: 90
    
    - name: Summary
      shell: pwsh
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        Write-Host "=========================================="
        Write-Host "Build completed successfully!"
        Write-Host "Version: $version"
        Write-Host "=========================================="
        Write-Host ""
        Write-Host "Artifacts created:"
        Get-ChildItem dist\*.exe | ForEach-Object {
          $size = [math]::Round($_.Length / 1MB, 2)
          Write-Host "  - $($_.Name) ($size MB)"
        }
        Write-Host ""
        Write-Host "Download artifacts from the Actions tab on GitHub."
