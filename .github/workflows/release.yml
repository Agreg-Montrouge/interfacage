name: Create Release

on:
  push:
    tags:
      - 'v*'  # Trigger sur les tags version (ex: v2025.02.0)

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: []  # Pas de dépendance, peut tourner en parallèle du build
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Récupère tout l'historique pour les notes de version
    
    - name: Extract version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
    
    - name: Generate release notes
      id: notes
      run: |
        # Récupère le dernier tag précédent
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        
        # Génère les notes de version
        if [ -n "$PREVIOUS_TAG" ]; then
          echo "## Changes since $PREVIOUS_TAG" > notes.md
          echo "" >> notes.md
          git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%an)" >> notes.md
        else
          echo "## Initial Release" > notes.md
          echo "" >> notes.md
          echo "First release of tpmontrouge v${{ steps.version.outputs.VERSION }}" >> notes.md
        fi
        
        cat notes.md
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: "TPMontrouge v${{ steps.version.outputs.VERSION }}"
        body_path: notes.md
        draft: false
        prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-artifacts:
    name: Upload Build Artifacts to Release
    runs-on: ubuntu-latest
    needs: [create-release]
    
    permissions:
      contents: write
    
    steps:
    - name: Wait for build-windows workflow
      uses: lewagon/wait-on-check-action@v1.3.4
      with:
        ref: ${{ github.ref }}
        check-name: 'Build Windows .exe with PyInstaller'
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        wait-interval: 30
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: List downloaded artifacts
      run: |
        echo "Downloaded artifacts:"
        find artifacts -type f
    
    - name: Upload artifacts to release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/**/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
